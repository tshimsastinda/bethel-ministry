<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publications | BETHEL MINISTRY International</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fond:#0d0d10;--carte:#17171c;--or:#d4af37;--texte:#ecebe6;--doux:#a9a8a2}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font-family:'Figtree',sans-serif;line-height:1.6}
header{padding:16px 20px;border-bottom:1px solid #2a2a31;display:flex;justify-content:space-between;align-items:center}
header a{color:var(--or);text-decoration:none;font-weight:600}
main{max-width:900px;margin:0 auto;padding:24px 20px 60px}
h1,h3{font-family:'Fraunces',serif;color:var(--or)}
h1{font-size:2rem;margin-bottom:4px}
h3{margin:6px 0}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:20px}
.carte{background:var(--carte);border:1px solid #2a2a31;border-radius:14px;padding:18px;display:flex;flex-direction:column}
.etiquette{align-self:flex-start;font-size:.78rem;color:var(--or);border:1px solid var(--or);border-radius:20px;padding:2px 10px}
.date{color:var(--doux);font-size:.85rem}
.resume{color:var(--doux);flex:1}
.partage{display:flex;gap:8px;margin-top:12px}
.partage a{flex:1;text-align:center;padding:10px;border-radius:8px;font-weight:600;font-size:.9rem;text-decoration:none}
.wa{background:#25d366;color:#08210f}
.fb{background:#1877f2;color:#fff}
footer{text-align:center;color:var(--doux);font-size:.85rem;padding:20px}
</style>
</head>
<body>
<header><strong>BETHEL MINISTRY</strong><a href="index.html">← Accueil</a></header>
<main>
  <h1>Publications</h1>
  <p>Prédications, enseignements et articles pour fortifier votre foi.</p>
  <div class="grille" id="grille"></div>
</main>
<footer>© 2026 BETHEL MINISTRY International<br>La Parole. La Foi. La Transformation.</footer>

<script>
// Pour ajouter un article : copie une ligne entre accolades { ... }, ajoute une virgule, et change le texte.
var articles = [
  { type: "Prédication", date: "À venir", titre: "Titre de la première prédication", resume: "Écris ici un court résumé de 1 à 2 phrases." },
  { type: "Enseignement", date: "À venir", titre: "Titre du premier enseignement", resume: "Écris ici un court résumé de 1 à 2 phrases." },
  { type: "Article", date: "À venir", titre: "Titre du premier article", resume: "Écris ici un court résumé de 1 à 2 phrases." }
];

var page = "https://tshimsastinda.github.io/bethel-ministry/publications.html";
var grille = document.getElementById("grille");

articles.forEach(function (a) {
  var texte = a.titre + " - BETHEL MINISTRY International\n" + page;
  var wa = "https://wa.me/?text=" + encodeURIComponent(texte);
  var fb = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(page);
  var carte = document.createElement("div");
  carte.className = "carte";
  carte.innerHTML =
    '<span class="etiquette">' + a.type + '</span>' +
    '<h3>' + a.titre + '</h3>' +
    '<div class="date">' + a.date + '</div>' +
    '<p class="resume">' + a.resume + '</p>' +
    '<div class="partage">' +
      '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' +
      '<a class="fb" href="' + fb + '" target="_blank" rel="noopener">Facebook</a>' +
    '</div>';
  grille.appendChild(carte);
});
</script>
</body>
</html>
